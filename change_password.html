{% extends 'base.html' %}{% block title %}Change password{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password</h1><p class="muted">Use a unique password with at least 10 characters.</p></div></div><section class="panel narrow"><form method="post" class="form-grid"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="field span-2"><label>Current password</label><input type="password" name="old_password" required autocomplete="current-password"></div><div class="field span-2"><label>New password</label><input type="password" name="new_password" required minlength="10" autocomplete="new-password"></div><div class="field span-2"><label>Confirm new password</label><input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"></div><button class="btn btn-primary span-2" type="submit">Update password</button></form></section>{% endblock %}
